name: Functional verification
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .env
      - run: .env/bin/python -m pip install -e '.[test]'
      - run: .env/bin/python scripts/maintenance.py check
      - run: .env/bin/python -m unittest discover -s tests -v
      - run: .env/bin/python scripts/release.py validate
      - run: .env/bin/python scripts/release.py build --preview --output dist/localMedBot-preview.zip
      - run: .env/bin/python scripts/release.py verify --archive dist/localMedBot-preview.zip
      - run: .env/bin/python scripts/release.py smoke --archive dist/localMedBot-preview.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .env
      - run: .env/bin/python -m pip install -e '.[test]'
      - run: .env/bin/python -m playwright install --with-deps chromium
      - run: .env/bin/python -m unittest discover -s tests -p test_browser.py -v
        env:
          LOCALMEDBOT_BROWSER_TESTS: '1'
