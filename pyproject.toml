[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localMedBot"
dynamic = ["version"]
description = "Bounded, source-linked clinical workflow prototype"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.18,<5", "Flask>=3,<4"]

[project.optional-dependencies]
test = ["playwright>=1.40,<2"]

[project.scripts]
localmedbot = "localmedbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localmedbot = ["templates/*.html", "static/*.css", "static/*.js", "version.json"]

[tool.setuptools.dynamic]
version = {attr = "localmedbot.__version__"}
