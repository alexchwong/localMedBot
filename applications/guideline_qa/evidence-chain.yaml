nodes:
- id: support.match
  module: evidence_stage
  needs:
  - reason
  - collected
  inputs:
    claims: artifacts.reason
    candidates: artifacts.collected
    task: run.input
  config:
    prompt: match.md
    role: match
  repairs: 1
- id: support.audit
  module: evidence_stage
  needs:
  - support.match
  inputs:
    claims: artifacts.reason
    candidates: artifacts.collected
    previous: artifacts.support.match
    task: run.input
  config:
    prompt: audit.md
    selected_only: true
  repairs: 1
- id: support.adjudicate
  module: evidence_stage
  needs:
  - support.audit
  inputs:
    claims: artifacts.reason
    candidates: artifacts.collected
    previous: artifacts.support.audit
    match: artifacts.support.match
    task: run.input
  when:
    from: artifacts.support.audit.disputed
    op: equals
    value: true
  config:
    prompt: adjudicate.md
  repairs: 1
- id: support.final
  module: evidence_finalize
  needs:
  - support.adjudicate
  inputs:
    claims: artifacts.reason
    candidates: artifacts.collected
    match: artifacts.support.match
    audit: artifacts.support.audit
    adjudication:
      from: artifacts.support.adjudicate
      optional: true
