version: 2
nodes:
- id: candidates
  module: retrieve
  inputs: {data: run.input}
  config: {limit: 12}
- id: reason
  module: reason
  needs: [candidates]
  input_schema: reason.input.schema.json
  inputs: {task: run.input, candidates: artifacts.candidates}
  config: {prompt: reason.md, mode: agent, max_turns: 6, tools: [evidence.search, evidence.read], role: reasoning}
  schema: claims.schema.json
- id: collected
  module: retrieve
  needs: [reason]
  inputs: {initial: artifacts.candidates, discovered: artifacts.reason.retrieved}
  config: {mode: collect, limit: 48}
- id: output
  module: render
  needs: [support.final]
  inputs: {data: artifacts.support.final}
  config: {template: output.md, title: Guideline answer, user_citations: true}
- id: output_check
  module: content_check
  needs: [output]
  input_schema: output_check.input.schema.json
  inputs: {target: artifacts.output, source: artifacts.support.final, task: run.input}
  config: {prompt: check.md, accepted_only: true, role: review}
  schema: check.schema.json
  review: {target: reason}
- id: approval
  module: human_review
  needs: [output_check]
  inputs: {output: artifacts.output}
includes: [evidence-chain.yaml]
output: output
review_node: approval
revision_target: reason
revision_targets: [reason]
