version: 3
nodes:
- id: records
  module: ingest
  inputs: {data: run.input}
  config: {profile: ingestion.yaml}
- id: facts
  module: reason
  needs: [records]
  input_schema: facts.input.schema.json
  inputs: {source: artifacts.records, task: run.input}
  config: {prompt: extract.md, role: extraction}
  schema: facts.schema.json
- id: facts_check
  module: content_check
  needs: [facts]
  input_schema: facts_check.input.schema.json
  inputs: {target: artifacts.facts, source: artifacts.records, task: run.input}
  config: {prompt: check.md, references: true, role: review}
  schema: check.schema.json
  review: {target: facts}
- id: draft
  module: reason
  needs: [facts_check]
  input_schema: draft.input.schema.json
  inputs: {source: artifacts.facts, task: run.input, omission_policy: run.omission_policy, genre: run.snapshot.selected_purpose}
  config: {prompt: draft.md, role: writing}
  schema: document.schema.json
- id: draft_check
  module: content_check
  needs: [draft]
  input_schema: draft_check.input.schema.json
  inputs: {target: artifacts.draft, source: artifacts.facts, task: run.input, omission_policy: run.omission_policy, genre: run.snapshot.selected_purpose}
  config: {prompt: check.md, document_coverage: true, role: review}
  schema: check.schema.json
  review: {target: draft}
- id: output
  module: render
  needs: [draft_check]
  inputs: {data: artifacts.draft}
  config: {template: output.md, document: true, user_citations: false}
- id: approval
  module: human_review
  needs: [output]
  inputs: {output: artifacts.output}
output: output
review_node: approval
revision_target: draft
revision_targets: [facts, draft]
