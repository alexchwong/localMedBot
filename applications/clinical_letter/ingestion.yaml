formats: [json, text, markdown]
mode: direct
chunk_chars: 2000
default_indexes: {kind: note}
indexes:
  kind:
    type: string
    required: true
    values: [note, medication, follow_up]
item_schema:
  type: object
  required: [id, text, indexes]
  additionalProperties: false
  properties:
    id: {type: string, minLength: 1}
    text: {type: string}
    indexes: {type: object}
